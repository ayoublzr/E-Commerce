spring.application.name=E-commerce
server.port=8087

# Charge les secrets depuis le .env (racine du repo ou dossier courant).
# "optional:" -> pas d'erreur si absent (ex. Docker, où les variables viennent de l'environnement).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000
jwt.refresh.expiration.ms=604800000

# Security
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept
security.cors.exposed-headers=Authorization

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# Email verification
app.verification-url=${APP_VERIFICATION_URL:http://localhost:8087/api/v1/auth/verify}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200/pages/login}